name: Production readiness checks

on:
  pull_request:
  push:
    branches:
      - main
      - hardening/production-readiness

jobs:
  php-lint-and-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DRIVER: local
      STRIPE_ENABLED: false
      MOBILE_MONEY_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, curl, dom, fileinfo, gd, intl, json, pdo_sqlite, sqlite3, xml
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Lint PHP files
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run automated tests
        run: php artisan test
