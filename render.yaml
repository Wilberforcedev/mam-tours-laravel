services:
  - type: web
    name: mam-tours
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /ping
    disk:
      name: mam-tours-storage
      mountPath: /var/www/html/storage/app
      sizeGB: 5
    envVars:
      - key: APP_NAME
        value: MAM Tours
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://mam-tours.onrender.com
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: mam-tours-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DRIVER
        value: local
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_PORT
        value: 587
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: MAM Tours
      - key: MAIL_ADMIN_EMAIL
        sync: false
      - key: STRIPE_ENABLED
        value: false
      - key: INTASEND_ENABLED
        value: false
      - key: MOBILE_MONEY_ENABLED
        value: false

databases:
  - name: mam-tours-db
    databaseName: mam_tours
    user: mam_tours_user
